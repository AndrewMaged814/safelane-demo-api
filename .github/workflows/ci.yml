name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test --configuration Release --no-restore

  publish:
    name: Publish image
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      probe-digest: ${{ steps.build-probe.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            APP_VERSION=main.${{ github.run_number }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate probe image metadata
        id: metadata-probe
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/safelane-demo-probe
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish external probe image
        id: build-probe
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.probe
          push: true
          tags: ${{ steps.metadata-probe.outputs.tags }}
          labels: ${{ steps.metadata-probe.outputs.labels }}
          cache-from: type=gha,scope=probe
          cache-to: type=gha,mode=max,scope=probe

      - name: Report immutable image digest
        shell: bash
        run: |
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${GITHUB_REPOSITORY,,}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/safelane-demo-probe@${{ steps.build-probe.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  publish-fixtures:
    name: Publish fixture (${{ matrix.name }})
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: healthy-redesign
            failure_rate: 0
            latency_ms: 0
          - name: broken-demo
            failure_rate: 100
            latency_ms: 0
          - name: final-healthy
            failure_rate: 0
            latency_ms: 0
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable fixture
        id: fixture
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/andrewmaged814/safelane-demo-api:fixture-${{ matrix.name }}
            ghcr.io/andrewmaged814/safelane-demo-api:fixture-${{ matrix.name }}-${{ github.sha }}
          build-args: |
            APP_VERSION=fixture-${{ matrix.name }}
            GIT_SHA=${{ github.sha }}
            DEMO_FAILURE_RATE=${{ matrix.failure_rate }}
            DEMO_LATENCY_MS=${{ matrix.latency_ms }}
          cache-from: type=gha,scope=fixture-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=fixture-${{ matrix.name }}

      - name: Report immutable fixture digest
        run: echo "ghcr.io/andrewmaged814/safelane-demo-api@${{ steps.fixture.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
